version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - whitespace

  settings:
    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      # Table-driven tests read clearer without error-wrapping ceremony.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
