name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sumzero
          POSTGRES_PASSWORD: sumzero
          POSTGRES_DB: sumzero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sumzero -d sumzero_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Installed from the version pinned in the Makefile rather than via
      # golangci-lint-action: the action's v6 line installs golangci-lint v1,
      # which cannot read this repo's v2-format .golangci.yml. Sharing the
      # Makefile pin keeps CI and local runs on the same linter.
      - name: Install golangci-lint
        run: |
          make lint-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://sumzero:sumzero@localhost:5432/sumzero_test?sslmode=disable
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...
